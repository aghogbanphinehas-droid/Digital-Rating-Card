<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Rating Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="star-icon">
                <img src="star.png" alt="golden star" width="48px" height="40px">
            </div>
            <h2>How did we do?</h2>
            <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
            <div class="rating">
                <div class="border border-1">1</div>
                <div class="border border-2">2</div>
                <div class="border border-3">3</div>
                <div class="border border-4">4</div>
                <div class="border border-5">5</div>
            </div>
            <button class="submit">Submit</button>
        </div>
    </div>
    
</body>
</html>
